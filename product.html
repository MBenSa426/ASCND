<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASCND Shop</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Montserrat',sans-serif;
        }

        body{
            background:#000;
            color:white;
        }

        nav{
            position:fixed;
            top:0;
            width:100%;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:25px 80px;
            background:rgba(0,0,0,0.9);
            z-index:1000;
        }

        .logo{
            font-size:2rem;
            font-weight:700;
            letter-spacing:4px;
        }

        .nav-links{
            display:flex;
            list-style:none;
            gap:30px;
        }

        .nav-links a{
            color:white;
            text-decoration:none;
            font-weight:600;
        }

        .shop-header{
            text-align:center;
            padding-top:150px;
            padding-bottom:50px;
        }

        .shop-header h1{
            font-size:4rem;
            letter-spacing:5px;
        }

        .products{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
            gap:30px;
            padding:50px 10%;
        }

        .product{
            background:#111;
            border-radius:15px;
            overflow:hidden;
            transition:0.3s;
        }

        .product:hover{
            transform:translateY(-10px);
        }

        .product img{
            width:100%;
            height:400px;
            object-fit:cover;
        }

        .product-info{
            padding:20px;
            text-align:center;
        }

        .product-info h3{
            margin-bottom:10px;
        }

        .price{
            color:#ccc;
            margin-bottom:15px;
        }

        .btn{
            display:inline-block;
            padding:12px 25px;
            background:white;
            color:black;
            text-decoration:none;
            border-radius:30px;
            font-weight:bold;
        }

        footer{
            text-align:center;
            padding:40px;
            background:#111;
            margin-top:50px;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">ASCND</div>

        <ul class="nav-links">
            <li><a href="Index.html">Home</a></li>
            <li><a href="product.html">Shop</a></li>
            <li><a href="about us.html">About</a></li>
            <li><a href="contact us.html">Contact</a></li>
            <li><a href="practice.html">Practice page</a></li>
        </ul>
    </nav>

    <section class="shop-header">
        <h1>SHOP</h1>
        <p>Premium Streetwear Collection</p>
    </section>

    <section class="products">

        <div class="product">
            <img src="Images/ASCND black hodie (model 1).png" alt="">
            <div class="product-info">
                <h3>ASCND Black Hoodie</h3>
                <p class="price">£49.99</p>
                <a href="blackHoodie.html" class="btn">Add to Cart</a>

            </div>
        </div>

        <div class="product">
            <img src="Images/ASCND white Hodie (model 2).png" alt="">
            <div class="product-info">
                <h3>ASCND White Hoodie</h3>
                <p class="price">£49.99</p>
                <a href="WhiteHoodie.html" class="btn">Add to Cart</a>
            </div>
        </div>

        <div class="product">
            <img src="Images/ASCND gray Hodie (model 1).png" alt="">
            <div class="product-info">
                <h3>ASCND Grey Hoodie</h3>
                <p class="price">£49.99</p>
                <a href="GrayHoodie.html" class="btn">Add to Cart</a>
            </div>
        </div>

    </section>

    <footer>
        <p>© 2026 ASCND.Mohamed Ben saud.</p>
    </footer>

</body>
</html>
